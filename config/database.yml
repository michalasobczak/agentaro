# SQLite only (spec 001). Two databases per environment:
#   primary — application data
#   audit   — HTTP audit log and data changelog (specs 003, 004), migrations in db/audit_migrate
# Database files live in storage/ and are never committed.
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development.sqlite3
  audit:
    <<: *default
    database: storage/development_audit.sqlite3
    migrations_paths: db/audit_migrate

test:
  primary:
    <<: *default
    database: storage/test.sqlite3
  audit:
    <<: *default
    database: storage/test_audit.sqlite3
    migrations_paths: db/audit_migrate

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  audit:
    <<: *default
    database: storage/production_audit.sqlite3
    migrations_paths: db/audit_migrate
